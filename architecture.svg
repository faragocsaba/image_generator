<svg width="100%" height="150" viewBox="0 0 760 150" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#656d76"/>
        </marker>
    </defs>
    
    <!-- Streamlit Frontend Box -->
    <g transform="translate(10, 30)">
        <rect width="190" height="90" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="95" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Streamlit Frontend</text>
        <text x="95" y="60" text-anchor="middle" font-size="11" fill="#57606a">(Streamlit Cloud / Local)</text>
    </g>

    <!-- ngrok Tunnel Box -->
    <g transform="translate(285, 30)">
        <rect width="180" height="90" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="90" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">ngrok Tunnel</text>
        <text x="90" y="60" text-anchor="middle" font-size="11" fill="#57606a">(Static Domain Routing)</text>
    </g>

    <!-- GPU Backend Box -->
    <g transform="translate(545, 30)">
        <rect width="205" height="90" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
        <text x="102" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">GPU Backend (Kaggle)</text>
        <text x="102" y="53" text-anchor="middle" font-size="11" fill="#57606a">(FastAPI + SDXL Base</text>
        <text x="102" y="73" text-anchor="middle" font-size="11" fill="#57606a">+ Csaba Style LoRA)</text>
    </g>

    <!-- Connectors / Arrows -->
    <!-- Frontend to ngrok -->
    <path d="M 202 65 L 275 65" fill="none" stroke="#656d76" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="238" y="52" text-anchor="middle" font-size="10" fill="#656d76">REST API</text>

    <!-- ngrok to Frontend (Response) -->
    <path d="M 275 85 L 202 85" fill="none" stroke="#656d76" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="238" y="103" text-anchor="middle" font-size="10" fill="#656d76">PNG Bytes</text>

    <!-- ngrok to GPU Backend -->
    <path d="M 465 75 L 535 75" fill="none" stroke="#656d76" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
